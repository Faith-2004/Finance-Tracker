<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Savings Goal - FinanceTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                FinanceTrack
            </a>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="mb-3">Add Savings Goal</h1>

                <p class="text-muted">
                    Create a goal and track how much you save toward it.
                </p>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-success">
                        Create Savings Goal
                    </button>

                    <a href="/" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
