<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Money - FinanceTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                FinanceTrack
            </a>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="card shadow-sm">

            <div class="card-body">

                <h1>Add Money to Savings Goal</h1>

                <p class="text-muted">
                    Goal:
                    <strong>{{ goal.name }}</strong>
                </p>

                <p>
                    Target Amount:
                    <strong>KSh {{ goal.target_amount }}</strong>
                </p>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-success">
                        Add Money
                    </button>

                    <a
                        href="{% url 'savings_goals' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
